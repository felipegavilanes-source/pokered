name: CI

on:
  push:
    branches: [ master, challenge-edition ]
  pull_request:
  workflow_dispatch:

env:
  rgbds_version: v1.0.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rgbds
        uses: actions/checkout@v7
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -j$(nproc) install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Compare
        if: ${{ github.repository_owner == 'pret' }}
        run: |
          make DEBUG=1 -j$(nproc) compare
          .github/checkdiff.sh

      - name: Verify clean checkout
        if: ${{ github.repository_owner != 'pret' }}
        run: .github/checkdiff.sh

      - name: Install Pokemon Yellow battle sprites
        if: ${{ github.repository_owner != 'pret' }}
        run: python3 tools/install_yellow_sprites.py

      - name: Make
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          make -j$(nproc)
          python3 tools/check_challenge_core.py

      - name: Headless gameplay smoke test (PyBoy)
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          python3 -m venv .pyboy-venv
          .pyboy-venv/bin/pip install --disable-pip-version-check pyboy==2.9.0
          .pyboy-venv/bin/python tools/challenge_smoke.py

      - name: Upload gameplay smoke screenshot
        if: ${{ always() && github.repository_owner != 'pret' && github.ref == 'refs/heads/challenge-edition' }}
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-challenge-smoke-screenshot
          path: challenge-selector-smoke.png
          if-no-files-found: ignore

      - name: Upload Challenge Edition ROM
        if: ${{ github.repository_owner != 'pret' && github.ref == 'refs/heads/challenge-edition' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-blue-challenge-edition
          path: pokeblue.gbc
          if-no-files-found: error

      - name: Checkout symbols
        if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
        uses: actions/checkout@v7
        with:
          path: symbols
          ref: symbols

      - name: Move symbols
        if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
        run: |
          cp -v *.sym *.map symbols/

      - name: Update symbols
        if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
        uses: EndBug/add-and-commit@v10
        with:
          cwd: "./symbols"
          add: "*.sym *.map"
          message: ${{ github.event.commits[0].message }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rgbds
        uses: actions/checkout@v7
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          brew install bison libpng pkg-config
          export PATH="$(brew --prefix bison)/bin:$PATH"
          sudo make -j$(sysctl -n hw.ncpu) install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Compare
        if: ${{ github.repository_owner == 'pret' }}
        run: |
          make DEBUG=1 -j$(sysctl -n hw.ncpu) compare
          .github/checkdiff.sh

      - name: Verify clean checkout
        if: ${{ github.repository_owner != 'pret' }}
        run: .github/checkdiff.sh

      - name: Install Pokemon Yellow battle sprites
        if: ${{ github.repository_owner != 'pret' }}
        run: python3 tools/install_yellow_sprites.py

      - name: Make
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          make -j$(sysctl -n hw.ncpu)
          python3 tools/check_challenge_core.py
